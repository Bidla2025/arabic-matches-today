<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDLAStream</title>
    <style>
        body { font-family: sans-serif; background: #0f0f12; color: white; padding: 20px; }
        .match-card { background: #1f1f24; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #22c55e; border: none; padding: 10px; color: white; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>BIDLAStream</h1>
    <div id="matches">Loading matches...</div>
    <iframe id="player" width="100%" height="400px" style="margin-top:20px; border:none;"></iframe>

    <script>
        fetch('matches.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('matches');
                container.innerHTML = '';
                Object.values(data).forEach(m => {
                    container.innerHTML += `<div class="match-card">
                        <span>${m.title}</span>
                        <button onclick="document.getElementById('player').src='${m.embed_url}'">Watch Now</button>
                    </div>`;
                });
            });
    </script>
</body>
</html>
