<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDLAStream</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0a0a0a; color: white; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 2px solid #22c55e; font-size: 24px; font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .video-box { background: #1a1a1a; border-radius: 15px; padding: 10px; margin-bottom: 20px; border: 1px solid #333; }
        iframe { width: 100%; height: 300px; border-radius: 10px; border: none; }
        .match-card { background: #1a1a1a; margin: 10px 0; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: 0.3s; }
        .match-card:hover { border-color: #22c55e; }
        button { background: #22c55e; color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">BIDLAStream</div>
    <div class="container">
        <div class="video-box">
            <iframe id="player" src="about:blank"></iframe>
        </div>
        <h3>Live & Upcoming Schedule</h3>
        <div id="matches">جاري تحميل المباريات...</div>
    </div>

    <script>
        fetch('matches.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('matches');
                container.innerHTML = '';
                Object.values(data).forEach(m => {
                    container.innerHTML += `
                        <div class="match-card">
                            <span>${m.title}</span>
                            <button onclick="document.getElementById('player').src='${m.embed_url}'">مشاهدة</button>
                        </div>`;
                });
            });
    </script>
</body>
</html>
