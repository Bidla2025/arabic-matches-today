<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDLAStream</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0c; color: white; margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #1f1f24; border-radius: 10px; margin-bottom: 20px; }
        .match-card { background: #1f1f24; padding: 15px; margin: 10px 0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        button { background: #22c55e; border: none; padding: 8px 15px; color: white; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .hero { text-align: center; padding: 20px; border-bottom: 1px solid #333; }
        iframe { width: 100%; height: 250px; border-radius: 12px; border: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <strong>BIDLAStream</strong>
        <span>🔍</span>
    </div>
    <div class="hero">
        <h2>Your Premium Sports Hub</h2>
        <div id="player-container"><iframe id="player" src="about:blank"></iframe></div>
    </div>
    <h3>Live & Upcoming Schedule</h3>
    <div id="matches">جاري تحميل المباريات...</div>

    <script>
        fetch('matches.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('matches');
                container.innerHTML = '';
                Object.values(data).forEach(m => {
                    container.innerHTML += `<div class="match-card">
                        <span>${m.title}</span>
                        <button onclick="document.getElementById('player').src='${m.embed_url}'">مشاهدة</button>
                    </div>`;
                });
            });
    </script>
</body>
</html>
