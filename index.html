<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDLAStream</title>
    <style>
        :root { --bg: #0a0a0c; --card: #1f1f24; --text: #ffffff; --primary: #6859f2; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--card); border-radius: 16px; margin-bottom: 20px; }
        .player-box { background: var(--card); padding: 10px; border-radius: 16px; text-align: center; }
        iframe { width: 100%; height: 350px; border-radius: 12px; border: none; background: #000; }
        .match-card { background: var(--card); padding: 16px; margin: 12px 0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        button { background: var(--primary); border: none; padding: 10px 20px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div style="font-weight: bold; font-size: 1.2rem;">BIDLAStream</div>
        <div style="color: #888;">🔍</div>
    </header>

    <div class="player-box">
        <iframe id="main-player" src=""></iframe>
    </div>

    <h3 style="margin-top: 30px;">المباريات المباشرة</h3>
    <div id="match-list">جاري تحميل المباريات...</div>

    <script>
        fetch('matches.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('match-list');
                list.innerHTML = '';
                Object.values(data).forEach(m => {
                    list.innerHTML += `
                        <div class="match-card">
                            <span>${m.title}</span>
                            <button onclick="document.getElementById('main-player').src='${m.embed_url}'">مشاهدة</button>
                        </div>`;
                });
            });
    </script>
</body>
</html>
